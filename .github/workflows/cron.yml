name: cron
# Vercel's Hobby plan only runs crons once a day. Until Patoli is on Pro, GitHub Actions
# pings the two maintenance endpoints every 5 minutes (GitHub may delay a few minutes).
# Repository secrets: APP_URL (https://patoli.bet) and CRON_SECRET (same value as on Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: arena settle / claims / finalize
        run: |
          curl -fsS -m 170 -X POST "$APP_URL/api/arena/settle" -H "Authorization: Bearer $CRON_SECRET" || echo "settle failed"
      - name: bets indexer
        run: |
          curl -fsS -m 170 -X POST "$APP_URL/api/indexer/run" -H "Authorization: Bearer $CRON_SECRET" || echo "indexer failed"
